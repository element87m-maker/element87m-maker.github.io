/* GALLERY */

}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  z-index:9999;
  justify-content:center;
  align-items:center;
  animation:zoomIn .25s ease;
}
@keyframes zoomIn{
  from{transform:scale(.9);opacity:0}
  to{transform:scale(1);opacity:1}
}
.modal img{
  width:100vw;
  height:100vh;
  object-fit:contain;
}
.close,.prev,.next{
  position:absolute;color:#fff;font-size:42px;cursor:pointer;
  user-select:none;
}
.close{top:20px;right:30px}
.prev{left:20px}
.next{right:20px}

/* FLOATING */
.floating{

.float-btn{

/* MOBILE */

<script>
/* Фотографії автоматично завантажуються зі сховища GitHub */
const GITHUB_OWNER = "element87m-maker";
const GITHUB_REPO = "element87m-maker.github.io";
const GITHUB_BRANCH = "main";

let current = [], index = 0;
const galleryCache = new Map();
let galleryRequest = 0;

const photosElement = document.getElementById("photos");
const titleElement = document.getElementById("title");
const modalElement = document.getElementById("modal");
const modalImageElement = document.getElementById("modalImg");
const messengersElement = document.getElementById("messengers");

async function getFolderImages(folder) {
  if (galleryCache.has(folder)) return galleryCache.get(folder);

  const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/images/${encodeURIComponent(folder)}?ref=${GITHUB_BRANCH}`;
  const response = await fetch(apiUrl, { headers: { "Accept": "application/vnd.github+json" } });

  if (response.status === 404) return [];
  if (!response.ok) {
    throw new Error(`GitHub API: ${response.status}`);
  }

  const files = await response.json();
  if (!Array.isArray(files)) return [];

  const images = files
    .filter(file => file.type === "file" && /\.(jpe?g|png|webp|gif)$/i.test(file.name))
    .sort((a, b) => {
      const aNumber = Number((a.name.match(/^\d+/) || [])[0]);
      const bNumber = Number((b.name.match(/^\d+/) || [])[0]);
      if (Number.isFinite(aNumber) && Number.isFinite(bNumber) && aNumber !== bNumber) {
        return aNumber - bNumber;
      }
      return a.name.localeCompare(b.name, "uk", { numeric: true, sensitivity: "base" });
    })
    .map(file => file.download_url)
    .filter(Boolean);

  galleryCache.set(folder, images);
  return images;
}

async function show(folder, title) {
  const requestId = ++galleryRequest;
  titleElement.innerText = title;
  photosElement.innerHTML = "";
  current = [];
  index = 0;
  modalElement.style.display = "none";

  const loadingMessage = document.createElement("p");
  loadingMessage.textContent = "Завантаження фотографій...";
  photosElement.appendChild(loadingMessage);

  try {
    const images = await getFolderImages(folder);
    if (requestId !== galleryRequest) return;

    current = images;
    photosElement.innerHTML = "";

    if (images.length === 0) {
      const emptyMessage = document.createElement("p");
      emptyMessage.textContent = "У цьому розділі поки немає фотографій.";
      photosElement.appendChild(emptyMessage);
      return;
    }

    images.forEach((src, i) => {
      const img = document.createElement("img");
      img.src = src;
      img.alt = `${title} — фото ${i + 1}`;
      img.loading = "lazy";
      img.onclick = () => openModal(i);
      photosElement.appendChild(img);
    });
  } catch (error) {
    if (requestId !== galleryRequest) return;
    photosElement.innerHTML = "";
    const errorMessage = document.createElement("p");
    errorMessage.textContent = "Не вдалося завантажити фотографії. Спробуйте оновити сторінку.";
    photosElement.appendChild(errorMessage);
    console.error(error);
  }
}

function openModal(i) {
  if (!current.length) return;
  index = i;
  modalElement.style.display = "flex";
  modalImageElement.src = current[index];
}

function closeModal() {
  modalElement.style.display = "none";
}

function change(step) {
  if (!current.length) return;
  index = (index + step + current.length) % current.length;
  modalImageElement.src = current[index];
}

function toggle() {
  messengersElement.classList.toggle("show");
}
</script>

<script>
/* ===== SWIPE FOR MOBILE MODAL ===== */
(function () {

  let startX = 0;
  let endX = 0;

  const modal = document.getElementById("modal");
  if (!modal) return;

  modal.addEventListener("touchstart", function (e) {
    startX = e.touches[0].clientX;
  }, { passive: true });

  modal.addEventListener("touchend", function (e) {
    endX = e.changedTouches[0].clientX;
    const distance = startX - endX;

    if (Math.abs(distance) > 60) {
      if (distance > 0) {
        change(1);
      } else {
        change(-1);
      }
    }
  }, { passive: true });

})();
</script>
