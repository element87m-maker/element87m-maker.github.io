<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELEMENT</title>

<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;color:#222}

/* HEADER */
header{background:#fff;padding:20px;text-align:center;border-bottom:1px solid #ddd}
header h1{margin:0;font-size:34px;letter-spacing:3px}

/* PHONES */
.phones{margin-top:15px;display:flex;justify-content:center;gap:15px;flex-wrap:wrap}
.phone-btn{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;border:2px solid #111;
  text-decoration:none;color:#111;font-size:17px;
}
.phone-btn:hover{background:#111;color:#fff}
.phone-btn svg{width:22px;height:22px}

/* MENU */
.menu{padding:20px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.menu button{
  padding:12px 20px;border:2px solid #111;
  background:none;cursor:pointer;font-size:15px;
}
.menu button:hover{background:#111;color:#fff}

/* GALLERY */
.gallery{padding:25px;text-align:center}
.photos{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}
.photos img{
  width:100%;height:160px;object-fit:cover;
  cursor:pointer;border-radius:6px;
  animation:fadeUp .4s ease;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  z-index:9999;
  justify-content:center;
  align-items:center;
  animation:zoomIn .25s ease;
}
@keyframes zoomIn{
  from{transform:scale(.9);opacity:0}
  to{transform:scale(1);opacity:1}
}
.modal img{
  width:100vw;
  height:100vh;
  object-fit:contain;
}
.close,.prev,.next{
  position:absolute;color:#fff;font-size:42px;cursor:pointer;
  user-select:none;
}
.close{top:20px;right:30px}
.prev{left:20px}
.next{right:20px}

/* FLOATING */
.floating{
  position:fixed;bottom:20px;right:20px;
  display:flex;flex-direction:column;gap:10px;
  z-index:10000;
}
.float-btn{
  display:flex;align-items:center;gap:10px;
  padding:14px 18px;border-radius:50px;
  color:#fff;text-decoration:none;
  box-shadow:0 6px 18px rgba(0,0,0,.3);
  cursor:pointer
}
.call{background:#28a745}
.write{background:#0d6efd}

.messengers{display:none;flex-direction:column;gap:8px}
.messengers.show{display:flex}
.messengers a{
  background:#fff;color:#000;
  padding:12px 16px;border-radius:40px;
  text-decoration:none;
  display:flex;align-items:center;gap:10px;
}
.messengers svg{width:20px;height:20px}

/* MOBILE */
@media(max-width:600px){
  .float-btn span{display:none}
}
</style>
</head>

<body>

<header>
<h1>ELEMENT</h1>
<div class="phones">

<a class="phone-btn" href="tel:+380978303655">

</svg>

</svg>
097-19-512-19
</a>

</div>
</header>

<div class="menu">
<button onclick="show('parkan','Паркани')">Паркани</button>
<button onclick="show('perila-ta-shody','Перила та сходи')">Перила та сходи</button>
<button onclick="show('hresty-pozolota','Хрести позолота')">Хрести позолота</button>
<button onclick="show('dymohid','Димохід')">Димохід</button>
<button onclick="show('navis','Навіс')">Навіс</button>
<button onclick="show('krynytsi','Криниці')">Криниці</button>
<button onclick="show('rizne','Різне')">Різне</button>
</div>

<div class="gallery">
<h2 id="title">Оберіть розділ</h2>
<div class="photos" id="photos"></div>
</div>

<div class="modal" id="modal">
<span class="close" onclick="closeModal()">×</span>
<span class="prev" onclick="change(-1)">‹</span>
<img id="modalImg">
<span class="next" onclick="change(1)">›</span>
</div>

<div class="floating">
<div class="messengers" id="messengers">
<a href="viber://chat?number=%2B380978303655">
<svg viewBox="0 0 24 24" fill="#7360f2"><path d="M12 2C6.5 2 2 6.1 2 11.2c0 2.9 1.5 5.5 4 7.3V22l4-2.2c.6.1 1.3.2 2 .2 5.5 0 10-4.1 10-9.2S17.5 2 12 2z"/></svg>

</div>

<script>
const data={
  parkan:113,
  "perila-ta-shody":29,
  "hresty-pozolota":22,
  dymohid:26,
  navis:3,
  krynytsi:8,
  rizne:69
};

let current=[],index=0;

function show(folder,title){
  document.getElementById("title").innerText=title;
  photos.innerHTML="";
  current=[];
  for(let i=1;i<=data[folder];i++){
    const src=`images/${folder}/${i}.jpg`;
    const img=document.createElement("img");
    img.src = src;
    img.loading = "lazy";
    img.onclick=()=>openModal(i-1);
    photos.appendChild(img);
    current.push(src);
  }
}

function openModal(i){
  index=i;
  modal.style.display="flex";
  modalImg.src=current[index];
}
function closeModal(){modal.style.display="none"}
function change(step){
  index=(index+step+current.length)%current.length;
  modalImg.src=current[index];
}
function toggle(){
  messengers.classList.toggle("show");
}
</script>
  <script>
/* ===== SWIPE FOR MOBILE MODAL ===== */
(function () {

  let startX = 0;
  let endX = 0;

  const modal = document.getElementById("modal");
  if (!modal) return;

  modal.addEventListener("touchstart", function (e) {
    startX = e.touches[0].clientX;
  }, { passive: true });

  modal.addEventListener("touchend", function (e) {
    endX = e.changedTouches[0].clientX;
    const distance = startX - endX;

    if (Math.abs(distance) > 60) {
      if (distance > 0) {
        change(1);   // swipe left → next
      } else {
        change(-1);  // swipe right → prev
      }
    }
  }, { passive: true });

})();
</script>
